  .status {
    justify-self: center; padding: .35rem .9rem; border: 1px solid var(--line);

  }
  nav { display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; }
  a { color: var(--fg); text-underline-offset: .25em; }
  a:hover, a:focus-visible { color: var(--accent); }
