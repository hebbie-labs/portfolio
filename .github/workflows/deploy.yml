name: Deploy

on:
  push:
    branches: [main, dev]

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # main -> :latest (www), dev -> :dev, see /srv/homelab/compose.yml
      # main builds the 'placeholder' target until launch, switch back to 'run'
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ github.ref == 'refs/heads/main' && 'placeholder' || 'dev' }}
          push: true
          tags: ghcr.io/hebbie-labs/portfolio:${{ github.ref == 'refs/heads/main' && 'latest' || 'dev' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # No docker/login-action in the deploy jobs: it overwrites the runner's persistent
  # ghcr.io login (PAT) and logs out afterwards. Log in once on the server instead.
  deploy-www:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    concurrency: deploy-www
    steps:
      - run: docker compose -f /srv/homelab/compose.yml pull portfolio
      - run: docker compose -f /srv/homelab/compose.yml up -d portfolio

  deploy-dev:
    needs: build
    if: github.ref == 'refs/heads/dev'
    runs-on: self-hosted
    concurrency: deploy-dev
    steps:
      - run: docker compose -f /srv/homelab/compose.yml pull portfolio-dev
      - run: docker compose -f /srv/homelab/compose.yml up -d portfolio-dev
