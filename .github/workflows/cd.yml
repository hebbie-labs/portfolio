name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, dev]

permissions:
  contents: read
  packages: write

# workflow_run always runs the file from the default branch (dev) and its
# github.ref is that branch, so branch and commit come from the CI run instead.
env:
  BRANCH: ${{ github.event.workflow_run.head_branch }}

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # main -> :latest (www), dev -> :dev, see /srv/homelab/compose.yml
      # main builds the 'placeholder' target until launch, switch back to 'run'
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ env.BRANCH == 'main' && 'placeholder' || 'dev' }}
          push: true
          tags: ghcr.io/hebbie-labs/portfolio:${{ env.BRANCH == 'main' && 'latest' || 'dev' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # No docker/login-action in the deploy jobs: it overwrites the runner's persistent
  # ghcr.io login (PAT) and logs out afterwards. Log in once on the server instead.
  deploy-www:
    needs: publish
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: self-hosted
    concurrency: deploy-www
    steps:
      - run: docker compose -f /srv/homelab/compose.yml pull portfolio
      - run: docker compose -f /srv/homelab/compose.yml up -d portfolio

  deploy-dev:
    needs: publish
    if: github.event.workflow_run.head_branch == 'dev'
    runs-on: self-hosted
    concurrency: deploy-dev
    steps:
      - run: docker compose -f /srv/homelab/compose.yml pull portfolio-dev
      - run: docker compose -f /srv/homelab/compose.yml up -d portfolio-dev
